<html lang="ar" dir="rtl">

<title>درجتي في منتصف الفصل</title>

<style>
/* Layout: one centered column — UJ header band, lookup card, result card with a 20-point meter */
:root{
  --navy:#004f6e; --sky:#83ccea; --grey:#6e96a2;
  --bg:#f3f6f7; --card:#ffffff; --fg:#26343a; --muted:#5f7f89; --line:#d7e3e7; --tint:#dff1f9;
  --ok:#1f7a4d; --err:#a8392f; --err-bg:#fbeceb;
  --font:'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1b21; --card:#13272f; --fg:#e4eef1; --muted:#93b1bb; --line:#24414b; --tint:#173845;
  --navy:#0a6a90; --sky:#83ccea; --ok:#5fc796; --err:#f08b80; --err-bg:#3a1f1d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1b21; --card:#13272f; --fg:#e4eef1; --muted:#93b1bb; --line:#24414b; --tint:#173845;
  --navy:#0a6a90; --sky:#83ccea; --ok:#5fc796; --err:#f08b80; --err-bg:#3a1f1d; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{direction:rtl;text-align:right;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.7;margin:0}
.band{background:#004f6e;color:#fff;position:relative;overflow:hidden}
.band .in{max-width:560px;margin:0 auto;padding-block:22px 26px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:16px}
.band .bars{position:absolute;top:0;right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:5px}
.band .bars i{display:block;width:8px;height:14px;background:var(--sky)}
.logo{width:64px;height:auto;background:#fff;border-radius:10px;padding:6px;flex:none}
.band h1{margin:0;font-size:1.45rem;font-weight:700;line-height:1.3;text-wrap:balance}
.band p{margin:2px 0 0;font-size:.88rem;color:#cfe9f4}
main{max-width:560px;margin:0 auto;padding-block:22px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
main>*{min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
label{display:block;font-weight:600;color:var(--fg);margin-bottom:8px}
.row{display:flex;gap:10px}
input{flex:1;min-width:0;width:100%;font:inherit;font-size:1.25rem;letter-spacing:.12em;direction:ltr;text-align:center;font-variant-numeric:tabular-nums;
  padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)}
input:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px var(--tint)}
button{font:inherit;font-weight:600;padding:12px 22px;border:0;border-radius:10px;background:var(--navy);color:#fff;cursor:pointer}
button:hover{filter:brightness(1.1)} button:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.hint{font-size:.85rem;color:var(--muted);margin:10px 0 0}
.msg{border-radius:10px;padding:12px 14px;background:var(--err-bg);color:var(--err);font-weight:500}
.res{display:grid;gap:14px}
.who{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.who b{font-size:1.15rem}
.chip{font-size:.8rem;font-weight:600;background:var(--tint);color:var(--navy);padding:2px 10px;border-radius:6px}
:root:not([data-theme="light"]) .chip{color:var(--sky)}
.score{display:flex;align-items:baseline;gap:8px;font-variant-numeric:tabular-nums}
.score .n{font-size:3.6rem;font-weight:700;color:var(--navy);line-height:1}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .score .n{color:var(--sky)}}
:root[data-theme="dark"] .score .n{color:var(--sky)}
.score .of{font-size:1.2rem;color:var(--muted)}
.meter{display:grid;grid-template-columns:repeat(20,1fr);gap:3px}
.meter i{height:12px;border-radius:2px;background:var(--line)}
.meter i.on{background:var(--sky)}
.meta{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted)}
.foot{font-size:.8rem;color:var(--muted);text-align:center}
@media (max-width:420px){.row{flex-direction:column}.score .n{font-size:3rem}}
@media (prefers-reduced-motion:no-preference){.res{animation:in .35s ease-out}@keyframes in{from{transform:translateY(6px)}to{transform:none}}}
</style>
</head>

<form class="card" id="f" autocomplete="off">
  <label for="uid">الرقم الجامعي</label>
  <div class="row"><input id="uid" name="uid" inputmode="numeric" maxlength="10" placeholder="2600xxx" aria-describedby="hint"><button type="submit" id="go">عرض الدرجة</button></div>

<script>
const SALT="uj-edustat-mid-2026";
const DATA={"a86658d5f6aad6f0f90a77fb": ["أمل", "E4", 19], "7ba1ab3de565b1d53701317c": ["آمنة", "E4", 18], "e66f7f3e97694cb4a075f300": ["جمانة", "E4", 18], "b85cb03e5a0a305e0e3b0db3": ["جميلة", "E4", 18], "dc34deb263d43bb19a42d7a0": ["سحر", "E4", 19], "a9735f772b0407d4a4a45efe": ["فاطمة", "E4", 20], "8f1c0db24d875d37e474a4d1": ["ميار", "E4", 20], "dd55e69dd2fe65b09304e229": ["أثير", "E3", 19], "00164f99f671d52755c47ca5": ["أريام", "E3", 20], "225b229f747847cc0e7dc248": ["أميرة", "E3", 19], "0e67e5ac2b5fad782ea198c9": ["بيادر", "E3", 20], "d96963419cbd215fb05a52fc": ["دالية", "E3", 20], "6a0fe05ba505d028d83d2d83": ["فاطمة", "E3", 18], "d6afa53c0209cebebfb8372d": ["مفيدة", "E3", 18], "a6f2be27edc595022392bc92": ["نوال", "E3", 20]};
const $=id=>document.getElementById(id);
for(let i=0;i<20;i++)$("meter").appendChild(document.createElement("i"));
const toLatin=s=>s.replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/\D/g,"");
async function h(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(SALT+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("").slice(0,24)}
$("f").addEventListener("submit",async e=>{
  e.preventDefault();
  const id=toLatin($("uid").value);
  $("res").hidden=true;$("err").hidden=true;
  if(id.length!==7){$("err").textContent="الرقم الجامعي يتكوّن من 7 أرقام. تحقّق من الرقم وأعد المحاولة.";$("err").hidden=false;return}
  const r=DATA[await h(id)];
  if(!r){$("err").textContent="هذا الرقم غير مسجّل في كشف المقرر. تحقّق من الرقم، أو راسل أستاذ المقرر.";$("err").hidden=false;return}
  const [n,s,g]=r;
  $("nm").textContent="مرحبًا "+n;$("sec").textContent="شعبة "+s;$("g").textContent=g;
  $("pct").textContent=Math.round(g/20*100)+"%";
  [...$("meter").children].forEach((c,i)=>c.classList.toggle("on",i<g));
  $("res").hidden=false;
});
</script>
